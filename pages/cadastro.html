<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><link rel="stylesheet" href="../css/style.css"><title>Cadastro de cliente | ACALMA</title></head><body>
<header><h1 class="site-brand"><a class="site-brand__link" href="../index.html" aria-label="ACALMA — página inicial"><img class="site-brand__image" src="../images/ACALMA_logotipo_proposta_01.png" alt="ACALMA"></a></h1><nav><a href="../index.html">Início</a><a href="produtos.html">Produtos</a><a href="meus-pedidos.html">Meus pedidos</a><a href="cupons.html">Cupons</a><a href="minha-conta.html">Minha conta</a><a href="carrinho.html">Carrinho</a><a href="cadastro.html" aria-current="page">Cadastre-se</a></nav></header>
<main class="cadastro-page"><section class="cadastro-titulo"><span class="eyebrow">Novo cliente</span><h2>Crie seu cadastro</h2><p>Informe seus dados pessoais e o endereço residencial ou de cobrança.</p></section><form id="formCadastroCliente" class="cadastro-card"><h3>Dados pessoais</h3><div class="form-grid cadastro-grid">
<label>Nome completo<input name="name" required></label><label>Gênero<select name="gender" required><option value="">Selecione</option><option>Feminino</option><option>Masculino</option><option>Outro</option><option>Prefiro não informar</option></select></label><label>Data de nascimento<input name="birth" type="date" required></label><label>CPF<input name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required></label><label>E-mail<input name="email" type="email" required></label><label>Telefone<input name="phone" inputmode="numeric" maxlength="15" placeholder="(00) 00000-0000" required></label></div>
<h3>Endereço residencial/de cobrança</h3><div class="form-grid cadastro-grid"><label>Identificação<input name="addressLabel" placeholder="Ex.: Casa" required></label><label>Tipo de logradouro<select name="streetType" required><option>Rua</option><option>Avenida</option><option>Travessa</option><option>Alameda</option></select></label><label>Logradouro<input name="street" required></label><label>Número<input name="number" required></label><label>Complemento<input name="complement" placeholder="Opcional"></label><label>Bairro<input name="district" required></label><label>CEP<input name="zip" inputmode="numeric" maxlength="9" placeholder="00000-000" required></label><label>Cidade<input name="city" required></label><label>Estado<input name="state" maxlength="2" placeholder="SP" required></label></div><div class="modal-acoes"><button type="reset" class="botao-secundario">Limpar</button><button type="submit" class="admin-botao-filtro">Finalizar cadastro</button></div></form></main><script src="../js/cadastro.js"></script><script src="../js/cart-badge.js"></script></body></html>
